[package]
name = "khipu"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A typed, multi-core programming language, and a laboratory for ideas that should not work"
repository = "https://github.com/psychedelicdevx/khipu"
readme = "README.md"
license = "MIT"
keywords = ["programming-language", "interpreter", "compiler", "concurrency"]
categories = ["compilers", "development-tools"]

[dependencies]
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = "0.23.46"
rustls-pemfile = "2.2.0"
signal-hook = "0.4.6"
cranelift-codegen = "0.138"
cranelift-frontend = "0.138"
cranelift-jit = "0.138"
cranelift-module = "0.138"
cranelift-native = "0.138"
ureq = "3.5.2"
