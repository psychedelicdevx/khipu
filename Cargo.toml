[package]
name = "khipu"
version = "0.1.0"
edition = "2024"
description = "JavaScript minus the bad parts, plus real types and real multi-core"
repository = "https://github.com/psychedelicdevx/khipu"
readme = "README.md"
keywords = ["programming-language", "interpreter", "compiler", "concurrency"]
categories = ["compilers", "development-tools"]

[dependencies]
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cranelift-codegen = "0.135.10"
cranelift-frontend = "0.135.10"
cranelift-jit = "0.135.10"
cranelift-module = "0.135.10"
cranelift-native = "0.135.10"
ureq = "3.5.2"
